name: publish

# A tag alone must not be able to ship. This runs on `v*`, proves the tag and the
# version constants agree, runs the suites, then waits for a human to approve the
# `npm` environment before anything reaches the registry.
#
# The FIRST publish of a package cannot happen here. npm will not let you
# configure a trusted publisher for a package that does not exist yet, and there
# is no token in this repository, so version 0.1.0 was published by hand from a
# logged-in machine. This workflow owns every version after it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the tag and package.json must name the same version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          echo "tag: $GITHUB_REF_NAME -> $tag_version"
          echo "package.json: $package_version"
          # Exact match. A tag that merely starts with the version would let
          # v0.1.10 publish 0.1.1.
          test "$tag_version" = "$package_version"
      - run: npm ci
      - name: the manifest and the server agree with package.json
        run: npm run check:versions
      - name: the extension keeps its pinned id
        run: npm run build && node scripts/check-extension-id.mjs
      - run: npm test
      - name: pack exactly what would be published
        run: npm pack --dry-run
      - name: no machine-specific launcher in the tarball
        run: |
          # `yoke install` writes dist/yoke-host.sh containing absolute paths from
          # whichever machine ran it. Publishing one would leak a home directory
          # and point installers at a file they do not have.
          if npm pack --dry-run 2>&1 | grep -E 'dist/.*\.(sh|bat)'; then
            echo "a launcher script reached the tarball"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Configured in repository settings with required reviewers, so approval is
    # a person rather than a branch rule.
    environment: npm
    permissions:
      contents: read
      # Trusted publishing exchanges this short-lived OIDC token for the right to
      # publish. There is no NPM_TOKEN in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14.0 or later.
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10.9.x, below the 11.5.1 trusted publishing needs, so
      # this upgrade is required rather than defensive.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              throw new Error("trusted publishing needs Node 22.14.0 or later, got " + process.versions.node);
            }
          '
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { throw new Error("trusted publishing needs npm 11.5.1 or later, got " + process.argv[1]); }
          ' "$(npm --version)"
      - run: npm ci
      - name: is this version already on the registry?
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # `npm view pkg@missing-version` exits 0 with EMPTY stdout, and only a
          # missing PACKAGE exits non-zero, so this tests the output. Testing the
          # exit code instead reports "already published" forever.
          found=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on the registry, so there is nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not published yet"
          fi
      # Provenance is attached automatically for a public package published over
      # OIDC from a public repository, so there is no --provenance here.
      #
      # Skipped rather than failed when the version is already up, so re-pushing
      # a tag is harmless and v0.1.0 (published by hand, before a trusted
      # publisher could exist) does not leave a permanent red run.
      - name: publish to npm
        if: steps.published.outputs.already == 'false'
        run: npm publish

  # The extension half: build the store package here and attach it to the
  # release, so the zip that reaches the store is the one CI built and checked
  # rather than whatever was sitting in a working copy.
  store-package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      zip: ${{ steps.digest.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: build the store package
        run: npm run package
      - name: record what it is, so an upload can be checked against this
        id: digest
        run: |
          zip=$(ls dist/store/*.zip)
          echo "path=$zip" >> "$GITHUB_OUTPUT"
          echo "### Chrome Web Store package" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$(basename "$zip")" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$zip" >> "$GITHUB_STEP_SUMMARY"
          unzip -Z1 "$zip" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created published, with the tag's own annotation as the notes.
          #
          # This used to create a DRAFT with the body "Draft.", which was a trap:
          # a draft is invisible on the releases page, so v0.1.3 shipped to npm
          # while GitHub still showed v0.1.1 as the latest release and the store
          # package sat on an unpublished draft nobody knew about. An automatic
          # release carrying the tag message is worse prose than a hand-written
          # one and infinitely better than one nobody can see. Edit the notes
          # afterwards; the release is already correct about existing.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "${{ steps.digest.outputs.path }}" --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: store-package
          path: ${{ steps.digest.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  # Uploads that zip to the Chrome Web Store and submits it for review.
  #
  # The chromewebstore scope is publisher wide, so whoever holds a token can push
  # code to every user of every extension on the account, into one holding
  # debugger and <all_urls>. That is why nothing long-lived exists for it: the
  # job trades its OIDC token for a 30 minute access token of a service account,
  # through a Workload Identity provider that only accepts tag runs of this
  # repository in the chrome-web-store environment, which waits for a person to
  # approve it. The job checks out no code and installs no packages, so the only
  # code that runs next to the token is the two actions below.
  chrome-web-store:
    needs: [publish, store-package]
    if: vars.CWS_WIF_PROVIDER != '' && vars.CWS_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: chrome-web-store
    # The store submits whichever package was uploaded last, so two releases
    # must not upload at the same time.
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: store-package
          path: dist/store
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      # Skips a version that is already in the store, so re-running a release is
      # harmless. Stops before uploading when the version is not higher than the
      # published one or another version is still in review.
      - uses: hamzahamidi/publish-to-chrome-web-store@v1
        with:
          access-token: ${{ steps.auth.outputs.access_token }}
          publisher-id: eebeaf6a-4418-44e5-9b37-2cc1f814532d
          item-id: mebojgahcmmffbaonhnmmjhmbdbfbamm
          zip: ${{ needs.store-package.outputs.zip }}
