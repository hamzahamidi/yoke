name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Every leg runs to completion: a Windows-only failure is the whole reason
      # for having the leg, and cancelling the others hides whether it is
      # platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: typecheck, strict
        run: npm run typecheck
      - name: tests
        run: npm test
      # Reads dist/install.js, which the tests step builds.
      - name: the extension manifest keeps its pinned id
        run: node scripts/check-extension-id.mjs
      - name: the version constants agree
        run: npm run check:versions
      # Built here so the store packaging guards run on every push rather than
      # only when someone is trying to ship. A zip the store would reject is
      # worth finding now, not while waiting on a review queue.
      - name: the store package builds and passes its own checks
        if: runner.os != 'Windows'
        run: npm run package
